<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}send money{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo-mark.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: { 950: '#0a0a0a', 900: '#171717', 700: '#404040', 500: '#737373', 300: '#d4d4d4', 100: '#f5f5f5' },
            money: { DEFAULT: '#16a34a', dark: '#15803d', soft: '#dcfce7' },
          },
          fontFamily: {
            sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'Inter', 'Segoe UI', 'sans-serif'],
            display: ['ui-sans-serif', 'system-ui', '-apple-system', 'Inter', 'sans-serif'],
          },
          boxShadow: {
            soft: '0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.04)',
          },
        }
      }
    }
  </script>
  <style>
    body { background: radial-gradient(1200px 600px at 50% -200px, #dcfce7 0%, #fafaf7 60%) #fafaf7; }
  </style>
</head>
<body class="min-h-screen text-ink-900 antialiased">
  <header class="sticky top-0 z-10 backdrop-blur bg-white/70 border-b border-ink-100">
    <div class="max-w-5xl mx-auto px-5 h-14 flex items-center justify-between">
      <a class="font-semibold tracking-tight" href="/">💸 send money</a>
      <nav class="flex items-center gap-5 text-sm text-ink-500">
        {% if user %}
          <a class="hover:text-ink-900" href="/u/{{ user.slug }}">my page</a>
          <a class="hover:text-ink-900" href="/me">edit</a>
          <a class="hover:text-ink-900" href="/logout">logout</a>
        {% else %}
          <a class="hover:text-ink-900" href="/login">login</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main class="max-w-5xl mx-auto px-5 py-10">
    {% block content %}{% endblock %}
  </main>
  <footer class="py-12 text-center text-sm text-ink-500">
    pay people. for no reason at all.
  </footer>
</body>
</html>
