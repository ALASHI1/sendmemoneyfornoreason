<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" role="img" aria-label="send money for no reason — LinkedIn cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="0.6" stop-color="#bbf7d0"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1584" height="396" fill="url(#bg)"/>

  <!-- soft halo behind mark -->
  <ellipse cx="320" cy="198" rx="280" ry="200" fill="url(#halo)"/>

  <!-- mark -->
  <g transform="translate(180,78)">
    <rect width="240" height="240" rx="56" fill="url(#markGrad)"/>
    <text x="120" y="172" text-anchor="middle" font-family="ui-rounded, -apple-system, BlinkMacSystemFont, 'SF Pro Rounded', system-ui, sans-serif" font-weight="900" letter-spacing="-10" font-size="160" fill="#ffffff">$?</text>
    <circle cx="196" cy="200" r="6" fill="#bbf7d0"/>
  </g>

  <!-- text -->
  <g font-family="ui-rounded, -apple-system, BlinkMacSystemFont, 'SF Pro Rounded', system-ui, sans-serif">
    <text x="500" y="180" font-weight="900" font-size="112" letter-spacing="-3" fill="#0a0a0a">send money.</text>
    <text x="500" y="290" font-weight="600" font-size="80" letter-spacing="-2" fill="#15803d">for no reason.</text>
  </g>

  <!-- url stamp -->
  <g transform="translate(1300,340)" font-family="ui-rounded, -apple-system, BlinkMacSystemFont, 'SF Pro Rounded', system-ui, sans-serif">
    <text x="0" y="0" font-size="28" font-weight="500" fill="#404040">sendmemoneyfornoreason.online</text>
  </g>
</svg>
