<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="send money for no reason">
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- mark -->
  <g transform="translate(40,40)">
    <rect width="240" height="240" rx="56" fill="url(#g2)"/>
    <text x="120" y="172" text-anchor="middle" font-family="ui-rounded, -apple-system, BlinkMacSystemFont, 'SF Pro Rounded', system-ui, sans-serif" font-weight="900" letter-spacing="-10" font-size="160" fill="#ffffff">$?</text>
    <circle cx="196" cy="200" r="6" fill="#bbf7d0"/>
  </g>

  <!-- wordmark -->
  <g font-family="ui-rounded, -apple-system, BlinkMacSystemFont, 'SF Pro Rounded', system-ui, sans-serif" fill="#0a0a0a">
    <text x="320" y="148" font-weight="800" font-size="86" letter-spacing="-3">send money.</text>
    <text x="320" y="232" font-weight="500" font-size="58" letter-spacing="-1" fill="#404040">for no reason.</text>
  </g>
</svg>
