# fly.toml — run `fly launch --no-deploy --copy-config` once, then `fly deploy`.
# Volume holds both the SQLite DB (/data/noreason.db) and uploaded avatars (/data/uploads).
app = "sendmemoneyfornoreason"
primary_region = "iad"

[build]

[env]
  PORT = "8000"
  UPLOAD_DIR = "/data/uploads"
  UPLOAD_URL_PREFIX = "/uploads"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
