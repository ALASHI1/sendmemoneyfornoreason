# fly.toml app configuration file generated for sendmemoneyfornoreason on 2026-05-03T22:29:23+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sendmemoneyfornoreason'
primary_region = 'iad'

[build]

[env]
  PORT = '8000'
  UPLOAD_DIR = '/data/uploads'
  UPLOAD_URL_PREFIX = '/uploads'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
